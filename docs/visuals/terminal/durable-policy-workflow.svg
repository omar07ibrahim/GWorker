<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="566" viewBox="0 0 1280 566" role="img" aria-labelledby="durable-policy-workflow-title durable-policy-workflow-description" data-capture-id="durable-policy-workflow">
<title id="durable-policy-workflow-title">Durable decisions · recommend, review, reopen, verify</title>
<desc id="durable-policy-workflow-description">Real output from the fixed synthetic CLI/storage harness. Four public CLI-handler calls reopen one disposable private journal, preserve exact propensity, freeze one history edge, verify it, and remove the workspace. The canonical plain-text transcript is stored beside this SVG.</desc>
<rect x="0" y="0" width="1280" height="566" fill="#0B1220"/>
<rect x="34" y="30" width="1212" height="506" rx="16" fill="#101828" stroke="#344054" stroke-width="2"/>
<circle cx="64" cy="60" r="7" fill="#F97066"/>
<circle cx="88" cy="60" r="7" fill="#FDB022"/>
<circle cx="112" cy="60" r="7" fill="#6CE9A6"/>
<text x="640" y="66" fill="#98A2B3" font-size="15" font-family="monospace" text-anchor="middle">GWORKER · REPRODUCIBLE TERMINAL EVIDENCE</text>
<text x="62" y="112" fill="#F2F4F7" font-size="25" font-weight="700" font-family="monospace">Durable decisions · recommend, review, reopen, verify</text>
<rect x="1016" y="88" width="196" height="34" rx="17" fill="#0B1220" stroke="#6CE9A6" stroke-width="1"/>
<text x="1114" y="111" fill="#6CE9A6" font-size="14" font-weight="700" font-family="monospace" text-anchor="middle">REAL OUTPUT · EXIT 0</text>
<text x="62" y="144" fill="#7CD4FD" font-size="14" font-family="monospace">TRANSCRIPT SHA-256 · aadff023da66499811b6790764495a02227cc44d3385741279b7f5448ab1b420</text>
<text x="62" y="176" fill="#6CE9A6" font-size="15" font-weight="700" font-family="monospace" xml:space="preserve">$ python scripts/demo_policy_journal.py</text>
<text x="62" y="198" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve"></text>
<text x="62" y="220" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">GWorker durable policy journal | deterministic synthetic workflow</text>
<text x="62" y="242" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">Policy: hierarchical-softmax-ucb-v1.8c10875dd38a025d</text>
<text x="62" y="264" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">D1 recommend | sequence 1 | focus-40 | exact p=0x1.0000000000000p-2</text>
<text x="62" y="286" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">D1 review    | fit=just_right | completed=true | exact propensity preserved</text>
<text x="62" y="308" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">D2 recommend | sequence 2 | focus-25 | history evidence=1 | exact p=0x1.1e5ae1020930fp-2</text>
<text x="62" y="330" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">Verify       | decisions/reviews/history edges = 2/1/1 | SQLite=ok</text>
<text x="62" y="352" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">Storage      | workspace 0700 | journal 0600 | path omitted</text>
<text x="62" y="374" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">Reopen        | every CLI call reopened the same disposable journal</text>
<text x="62" y="396" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">Cleanup       | temporary workspace removed</text>
<text x="62" y="418" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">Scope         | synthetic CLI/storage evidence only; not a human outcome or locked evaluation</text>
