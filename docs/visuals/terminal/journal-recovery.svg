<text x="62" y="144" fill="#7CD4FD" font-size="14" font-family="monospace">TRANSCRIPT SHA-256 · bc077acc3dba23616efbf2ea6a52c2c092ae00a64d582383c662b24125c8db91</text>
<text x="62" y="176" fill="#6CE9A6" font-size="15" font-weight="700" font-family="monospace" xml:space="preserve">$ python scripts/demo_journal.py --repo-root . --workspace .gworker/visual-demo/terminal-capture --reset</text>
