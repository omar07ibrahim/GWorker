<text x="62" y="220" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">GWorker journal demo | real SQLite store, synthetic events</text>
<text x="62" y="242" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">Workspace: .gworker/visual-demo/terminal-capture</text>
<text x="62" y="264" fill="#F2F4F7" font-size="15" font-weight="400" font-family="monospace" xml:space="preserve">Database:  .gworker/visual-demo/terminal-capture/live/events.sqlite3</text>
