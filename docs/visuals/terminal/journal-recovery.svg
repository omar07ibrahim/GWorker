<title id="journal-recovery-title">SQLite journal · reopen, replay, detect tamper</title>
<desc id="journal-recovery-description">Real output from the descriptor-safe synthetic journal demo. It writes the production SQLiteEventStore, reopens and replays it, then detects a logical mutation in a separate copy. The canonical plain-text transcript is stored beside this SVG.</desc>
