  <rect x="306" y="224" width="230" height="154" rx="12" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2"/>
  <text x="324" y="254" font-size="16" font-weight="750" fill="#CC79A7" text-anchor="start">EXPLICIT REVIEW</text>
