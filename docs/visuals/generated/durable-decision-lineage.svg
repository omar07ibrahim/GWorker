  <text x="72" y="836" font-size="12" font-weight="800" fill="#0072B2" text-anchor="start">PRIVACY / CLAIM BOUNDARY</text>
  <text x="72" y="861" font-size="14" font-weight="600" fill="#1B1F23" text-anchor="start">Disposable private journal removed after verification · no host path rendered · no locked evaluator or publication run</text>
