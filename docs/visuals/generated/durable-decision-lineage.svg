<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="durable-decision-lineage-title durable-decision-lineage-description">
  <title id="durable-decision-lineage-title">Durable recommendations retain exact review and replay lineage</title>
  <desc id="durable-decision-lineage-description">A source-derived fixed workflow uses the public SQLiteEventStore on a disposable private journal: recommend D1, record one explicit review, reopen for D2, then reopen and verify two decisions, one review, one history edge, the exact policy fingerprint, and SQLite integrity.</desc>
