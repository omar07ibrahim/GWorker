<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1434 970" role="img" aria-labelledby="focus-session-linkage-title focus-session-linkage-description">
  <title id="focus-session-linkage-title">Session progress stays provenance until an explicit review</title>
  <desc id="focus-session-linkage-description">A fixed synthetic workflow exercises the public SQLiteEventStore in a disposable private journal. It durably recommends, separately appends a matching plan, links before start, starts and abandons the session, proves zero inferred reviews, records one explicit review, reopens, derives the session identity through the planned event, and verifies the journal. Identifiers are stable and truncated; no objective or host path is rendered.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1434" height="970" fill="#FFFFFF"/>
  <text x="42" y="48" font-size="14" font-weight="700" fill="#CC79A7" text-anchor="start">SCHEMA-v3 FOCUS LINKAGE · REAL PUBLIC STORAGE API</text>
  <text x="42" y="84" font-size="28" font-weight="700" fill="#1B1F23" text-anchor="start">Session progress stays provenance until an explicit review</text>
  <text x="42" y="116" font-size="15" font-weight="400" fill="#667085" text-anchor="start">Fixed synthetic records · disposable private journal · replay and lookup verified after reopen</text>
  <rect x="42" y="132" width="1350" height="24" rx="6" fill="#FBF7FC" stroke="#CC79A7" stroke-width="1"/>
  <text x="717" y="149" font-size="13" font-weight="700" fill="#CC79A7" text-anchor="middle">Provenance link ≠ feedback · event codec remains v1 · locked outcome artifacts = 0</text>
  <line x1="252" y1="266" x2="266" y2="266" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="42" y="168" width="210" height="196" rx="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="147" y="200" font-size="13" font-weight="800" fill="#0072B2" text-anchor="middle">1 · RECOMMEND</text>
  <text x="58" y="240" font-size="12" font-weight="400" fill="#667085" text-anchor="start"><tspan x="58" dy="0">decision 018f4f…9201</tspan><tspan x="58" dy="28">seq 1 · focus-15</tspan><tspan x="58" dy="28">15+3 min</tspan><tspan x="58" dy="28">reviews seen = 0</tspan></text>
  <line x1="480" y1="266" x2="494" y2="266" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="168" width="210" height="196" rx="12" fill="#FFFFFF" stroke="#56B4E9" stroke-width="2"/>
  <text x="375" y="200" font-size="13" font-weight="800" fill="#56B4E9" text-anchor="middle">2 · APPEND PLAN</text>
  <text x="286" y="240" font-size="12" font-weight="400" fill="#667085" text-anchor="start"><tspan x="286" dy="0">event 018f4f…9203</tspan><tspan x="286" dy="28">session 018f4f…9202</tspan><tspan x="286" dy="28">revision 1 · planned</tspan><tspan x="286" dy="28">durations match choice</tspan></text>
  <line x1="708" y1="266" x2="722" y2="266" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="498" y="168" width="210" height="196" rx="12" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <text x="603" y="200" font-size="13" font-weight="800" fill="#009E73" text-anchor="middle">3 · LINK BEFORE START</text>
  <text x="514" y="240" font-size="12" font-weight="400" fill="#667085" text-anchor="start"><tspan x="514" dy="0">link_focus_session()</tspan><tspan x="514" dy="28">decision ↔ planned event</tspan><tspan x="514" dy="28">one immutable row</tspan><tspan x="514" dy="28">reviews remain 0</tspan></text>
  <line x1="936" y1="266" x2="950" y2="266" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="726" y="168" width="210" height="196" rx="12" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/>
  <text x="831" y="200" font-size="13" font-weight="800" fill="#E69F00" text-anchor="middle">4 · START → ABANDON</text>
  <text x="742" y="240" font-size="12" font-weight="400" fill="#667085" text-anchor="start"><tspan x="742" dy="0">FocusStarted · seq 2</tspan><tspan x="742" dy="28">SessionAbandoned · seq 3</tspan><tspan x="742" dy="28">phase = abandoned</tspan><tspan x="742" dy="28">reason = priority_changed</tspan></text>
  <line x1="1164" y1="266" x2="1178" y2="266" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="954" y="168" width="210" height="196" rx="12" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2"/>
  <text x="1059" y="200" font-size="13" font-weight="800" fill="#CC79A7" text-anchor="middle">5 · EXPLICIT REVIEW</text>
  <text x="970" y="240" font-size="12" font-weight="400" fill="#667085" text-anchor="start"><tspan x="970" dy="0">record_review() separately</tspan><tspan x="970" dy="28">fit = too_short</tspan><tspan x="970" dy="28">objective completed = false</tspan><tspan x="970" dy="28">reviews 0 → 1</tspan></text>
  <rect x="1182" y="168" width="210" height="196" rx="12" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <text x="1287" y="200" font-size="13" font-weight="800" fill="#009E73" text-anchor="middle">6 · REOPEN + LOOKUP</text>
  <text x="1198" y="240" font-size="12" font-weight="400" fill="#667085" text-anchor="start"><tspan x="1198" dy="0">input session 018f4f…9202</tspan><tspan x="1198" dy="28">derived decision 018f4f…9201</tspan><tspan x="1198" dy="28">derived plan 018f4f…9203</tspan><tspan x="1198" dy="28">same link = true</tspan></text>
  <rect x="42" y="402" width="662" height="272" rx="18" fill="#F6FBF8" stroke="#009E73" stroke-width="2"/>
  <text x="66" y="438" font-size="15" font-weight="800" fill="#009E73" text-anchor="start">PROVENANCE · focus_session_links</text>
  <text x="680" y="438" font-size="13" font-weight="700" fill="#667085" text-anchor="end">SQLite schema v3</text>
  <rect x="66" y="462" width="614" height="118" rx="12" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <rect x="66" y="462" width="614" height="42" rx="10" fill="#E7F5EF" stroke="#009E73" stroke-width="1"/>
  <line x1="368" y1="462" x2="368" y2="580" stroke="#009E73" stroke-width="1"/>
  <text x="217" y="489" font-size="14" font-weight="800" fill="#009E73" text-anchor="middle">decision_id</text>
  <text x="524" y="489" font-size="14" font-weight="800" fill="#009E73" text-anchor="middle">planned_event_id</text>
  <text x="217" y="548" font-size="16" font-weight="700" fill="#1B1F23" text-anchor="middle" font-family="monospace">018f4f…9201</text>
  <text x="524" y="548" font-size="16" font-weight="700" fill="#1B1F23" text-anchor="middle" font-family="monospace">018f4f…9203</text>
  <text x="66" y="610" font-size="15" font-weight="750" fill="#009E73" text-anchor="start">session_id is not stored in this table</text>
  <text x="66" y="640" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Lookup joins planned_event_id → events and derives session 018f4f…9202.</text>
  <rect x="730" y="402" width="662" height="272" rx="18" fill="#FBF7FC" stroke="#CC79A7" stroke-width="2"/>
  <text x="754" y="438" font-size="15" font-weight="800" fill="#CC79A7" text-anchor="start">FEEDBACK · policy_reviews</text>
  <line x1="1056" y1="466" x2="1056" y2="642" stroke="#E4E7EC" stroke-width="2"/>
  <text x="778" y="478" font-size="12" font-weight="800" fill="#E69F00" text-anchor="start">BEFORE EXPLICIT REVIEW</text>
  <text x="778" y="526" font-size="46" font-weight="800" fill="#E69F00" text-anchor="start">0</text>
  <text x="838" y="516" font-size="16" font-weight="700" fill="#1B1F23" text-anchor="start">reviews</text>
  <text x="778" y="558" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="778" dy="0">3 session events</tspan><tspan x="778" dy="26">terminal phase = abandoned</tspan><tspan x="778" dy="26">history edges = 0</tspan></text>
  <text x="1080" y="478" font-size="12" font-weight="800" fill="#CC79A7" text-anchor="start">AFTER record_review()</text>
  <text x="1080" y="526" font-size="46" font-weight="800" fill="#CC79A7" text-anchor="start">1</text>
  <text x="1140" y="516" font-size="16" font-weight="700" fill="#1B1F23" text-anchor="start">review</text>
  <text x="1080" y="558" font-size="14" font-weight="400" fill="#667085" text-anchor="start"><tspan x="1080" dy="0">fit = too_short</tspan><tspan x="1080" dy="26">completion = false</tspan><tspan x="1080" dy="26">history edges = 0</tspan></text>
  <text x="754" y="650" font-size="14" font-weight="700" fill="#CC79A7" text-anchor="start">Starting and abandoning the session never synthesize feedback.</text>
  <rect x="42" y="710" width="246" height="92" rx="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="60" y="750" font-size="26" font-weight="800" fill="#0072B2" text-anchor="start">1 / 3</text>
  <text x="60" y="778" font-size="11" font-weight="750" fill="#667085" text-anchor="start">SESSIONS / EVENTS</text>
  <rect x="312" y="710" width="246" height="92" rx="12" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/>
  <text x="330" y="750" font-size="26" font-weight="800" fill="#E69F00" text-anchor="start">1 / 0</text>
  <text x="330" y="778" font-size="11" font-weight="750" fill="#667085" text-anchor="start">DECISIONS / REVIEWS · BEFORE</text>
  <rect x="582" y="710" width="246" height="92" rx="12" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2"/>
  <text x="600" y="750" font-size="26" font-weight="800" fill="#CC79A7" text-anchor="start">1 / 1</text>
  <text x="600" y="778" font-size="11" font-weight="750" fill="#667085" text-anchor="start">DECISIONS / REVIEWS · AFTER</text>
  <rect x="852" y="710" width="246" height="92" rx="12" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <text x="870" y="750" font-size="26" font-weight="800" fill="#009E73" text-anchor="start">0</text>
  <text x="870" y="778" font-size="11" font-weight="750" fill="#667085" text-anchor="start">HISTORY EDGES</text>
  <rect x="1122" y="710" width="246" height="92" rx="12" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
  <text x="1140" y="750" font-size="26" font-weight="800" fill="#009E73" text-anchor="start">OK</text>
  <text x="1140" y="778" font-size="11" font-weight="750" fill="#667085" text-anchor="start">SQLITE QUICK_CHECK</text>
  <rect x="42" y="838" width="1350" height="94" rx="12" fill="#F7FBFF" stroke="#56B4E9" stroke-width="1"/>
  <text x="66" y="870" font-size="12" font-weight="800" fill="#0072B2" text-anchor="start">PRIVACY / CLAIM BOUNDARY</text>
  <text x="66" y="896" font-size="14" font-weight="600" fill="#1B1F23" text-anchor="start"><tspan x="66" dy="0">Synthetic fixture only · objective and host path omitted · temporary journal removed</tspan><tspan x="66" dy="22">No evaluator, publication run, result metric, inferred feedback, or causal claim</tspan></text>
</svg>
