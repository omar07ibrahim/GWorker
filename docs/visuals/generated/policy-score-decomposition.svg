<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" role="img" aria-labelledby="policy-score-title policy-score-description">
  <title id="policy-score-title">Twelve explicit reviews produce an explainable focus-40 choice</title>
  <desc id="policy-score-description">A fixed sequence of twelve recommendations is reviewed through the public API. The thirteenth recommendation selects focus-40. Each feasible arm directly labels its posterior, ordinal adjustment, UCB bonus, total score, review count, and exact logged propensity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1280" height="740" fill="#FFFFFF"/>
