  <text x="76" y="628" font-size="13" font-weight="700" fill="#0072B2" text-anchor="start">THE TWELVE REVIEWED CHOICES (minutes)</text>
  <text x="76" y="660" font-size="17" font-weight="650" fill="#1B1F23" text-anchor="start">25 → 40 → 40 → 40 → 50 → 40 → 40 → 40 → 40 → 40 → 40 → 40</text>
  <text x="76" y="683" font-size="13" font-weight="400" fill="#667085" text-anchor="start">Feedback rule: below 40 = too short; 40 = just right; above 40 = too long. Completion is explicit at ≥40.</text>
