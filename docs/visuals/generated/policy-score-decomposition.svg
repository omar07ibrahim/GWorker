  <text x="56" y="88" font-size="27" font-weight="700" fill="#1B1F23" text-anchor="start">Twelve explicit reviews produce an explainable focus-40 choice</text>
  <text x="56" y="118" font-size="16" font-weight="600" fill="#667085" text-anchor="start">bucket=exact · evidence=12 reviews · selected=focus-40 · propensity=0.732264546148</text>
