  <text x="426" y="176" font-size="13" font-weight="400" fill="#1B1F23" text-anchor="start">UCB bonus</text>
  <text x="610" y="178" font-size="13" font-weight="400" fill="#667085" text-anchor="start">Probability bars use exact softmax + 2% floor values.</text>
  <rect x="56" y="210" width="1168" height="102" rx="12" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1"/>
