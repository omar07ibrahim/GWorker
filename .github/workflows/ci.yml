name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned development tools
        run: python -m pip install --no-input -e '.[dev]'

      - name: Lint, format, and type-check
        run: |
          ruff check .
          ruff format --check .
          mypy src scripts/visuals/capture_cli_motion.py scripts/verify_distribution.py

      - name: Compile every Python source
        run: python -m compileall -q src tests scripts

      - name: Run the complete branch-coverage suite
        run: coverage run --branch -m unittest discover -s tests -v

      - name: Enforce the coverage floor
        run: coverage report --show-missing --fail-under=90

      - name: Prove quality checks preserved the checkout
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Export the reviewed coverage report
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          mkdir -p build/coverage
          coverage xml -o build/coverage/coverage.xml

      - name: Upload the coverage report
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.12
          path: build/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 14

  evidence:
    name: Reproducible evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.SOURCE_REVISION }}

      - name: Assert the immutable source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned evidence tools
        run: python -m pip install --no-input -e '.[dev]'

      - name: Verify every committed evidence pipeline
        id: evidence_gate
        shell: bash
        run: |
          set -euo pipefail
          if PYTHONPATH=src python -B scripts/visuals/generate.py --check \
            && PYTHONPATH=src python -B -m scripts.visuals.generate_offline_replay --check \
            && PYTHONPATH=src python -B scripts/visuals/capture_terminal.py check \
            && PYTHONPATH=src python -B scripts/visuals/capture_cli_motion.py check; then
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            echo "drift=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          candidate="$RUNNER_TEMP/generated-evidence-candidate"
          install -d -m 0700 -- "$candidate/docs"
          for name in diagrams offline terminal motion; do
            git worktree add --detach "$RUNNER_TEMP/gworker-$name" "$SOURCE_REVISION"
          done

          (
            cd "$RUNNER_TEMP/gworker-terminal"
            PYTHONPATH=src python -B scripts/visuals/capture_terminal.py record
            PYTHONPATH=src python -B scripts/visuals/capture_terminal.py check
          )
          (
            cd "$RUNNER_TEMP/gworker-motion"
            PYTHONPATH=src python -B scripts/visuals/capture_cli_motion.py record
            PYTHONPATH=src python -B scripts/visuals/capture_cli_motion.py check
          )
          (
            cd "$RUNNER_TEMP/gworker-offline"
            PYTHONPATH=src python -B -m scripts.visuals.generate_offline_replay
            PYTHONPATH=src python -B -m scripts.visuals.generate_offline_replay --check
          )
          cp -a "$RUNNER_TEMP/gworker-terminal/docs/visuals/terminal/." \
            "$RUNNER_TEMP/gworker-diagrams/docs/visuals/terminal/"
          cp -a "$RUNNER_TEMP/gworker-motion/docs/visuals/motion/." \
            "$RUNNER_TEMP/gworker-diagrams/docs/visuals/motion/"
          (
            cd "$RUNNER_TEMP/gworker-diagrams"
            PYTHONPATH=src python -B scripts/visuals/generate.py
            PYTHONPATH=src python -B scripts/visuals/generate.py --check
          )

          cp -a "$RUNNER_TEMP/gworker-diagrams/docs/visuals" "$candidate/docs/"
          cp -a "$RUNNER_TEMP/gworker-offline/docs/offline" "$candidate/docs/"
          rm -rf "$candidate/docs/visuals/terminal" "$candidate/docs/visuals/motion"
          cp -a "$RUNNER_TEMP/gworker-terminal/docs/visuals/terminal" \
            "$candidate/docs/visuals/"
          cp -a "$RUNNER_TEMP/gworker-motion/docs/visuals/motion" \
            "$candidate/docs/visuals/"

          CANDIDATE_ROOT="$candidate" python - <<'PY'
          import os
          import stat
          import subprocess
          from pathlib import Path

          root = Path(os.environ["CANDIDATE_ROOT"])
          scopes = ("docs/visuals", "docs/offline")
          tracked_raw = subprocess.run(
              ("git", "ls-files", "-z", "--", *scopes),
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          tracked = {
              item.decode("utf-8", errors="strict")
              for item in tracked_raw.split(b"\0")
              if item
          }
          observed: set[str] = set()
          changed: set[str] = set()
          for path in root.rglob("*"):
              mode = path.lstat().st_mode
              if stat.S_ISLNK(mode):
                  raise SystemExit("evidence candidate contains a symlink")
              if stat.S_ISDIR(mode):
                  continue
              if not stat.S_ISREG(mode):
                  raise SystemExit("evidence candidate contains a special file")
              if stat.S_IMODE(mode) != 0o644:
                  raise SystemExit("evidence candidate has non-canonical permissions")
              relative = path.relative_to(root).as_posix()
              observed.add(relative)
              adopted = Path(relative)
              if not adopted.is_file() or adopted.read_bytes() != path.read_bytes():
                  changed.add(relative)
          if observed != tracked:
              raise SystemExit("evidence candidate inventory differs from tracked scope")
          if not changed:
              raise SystemExit("evidence candidate reports no byte drift")
          status = subprocess.run(
              ("git", "status", "--porcelain=v1", "--untracked-files=all"),
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          if status:
              raise SystemExit("candidate generation changed the source checkout")
          print(f"review candidate: {len(observed)} files; {len(changed)} changed")
          PY
          echo "drift=true" >>"${GITHUB_OUTPUT}"

      - name: Preserve regenerated evidence for review
        if: steps.evidence_gate.outputs.drift == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-evidence-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/generated-evidence-candidate/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 1

      - name: Reject stale committed evidence
        if: steps.evidence_gate.outputs.drift == 'true'
        run: exit 1

  package:
    name: Distribution integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the pinned package-check tools
        run: python -m pip install --no-input build==1.5.0 Pillow==12.3.0

      - name: Bind build timestamps to the checked-out commit
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Build the source archive and its wheel
        run: |
          mkdir -p build/dist-primary
          python -m build --outdir build/dist-primary

      - name: Build an independent wheel from the Git snapshot
        run: |
          mkdir -p build/rebuild-source build/dist-rebuild
          git archive --format=tar --output=build/rebuild-source.tar HEAD
          tar -xf build/rebuild-source.tar -C build/rebuild-source
          cd build/rebuild-source
          python -m build --wheel --outdir ../dist-rebuild

      - name: Verify wheel reproducibility and distribution contents
        run: |
          python -B scripts/verify_distribution.py \
            build/dist-primary build/dist-rebuild --json \
            > build/distribution-verification.json

      - name: Exercise the complete source archive
        run: |
          mkdir -p build/sdist-source
          tar -xzf build/dist-primary/*.tar.gz \
            --strip-components=1 -C build/sdist-source
          cd build/sdist-source
          PYTHONPATH=src python -B -m unittest discover -s tests
          PYTHONPATH=src python -B scripts/visuals/generate.py --check
          PYTHONPATH=src python -B -m scripts.visuals.generate_offline_replay --check
          PYTHONPATH=src python -B scripts/visuals/capture_terminal.py check
          PYTHONPATH=src python -B scripts/visuals/capture_cli_motion.py check

      - name: Install and smoke-test the built wheel
        run: |
          python -m venv build/wheel-smoke
          build/wheel-smoke/bin/python -m pip install \
            --no-index --no-deps --no-input build/dist-primary/*.whl
          build/wheel-smoke/bin/python -m pip check
          wheel_python="$PWD/build/wheel-smoke/bin/python"
          wheel_cli="$PWD/build/wheel-smoke/bin/gworker"
          smoke_root="$PWD/build/wheel-smoke-runtime"
          mkdir -m 700 "$smoke_root"
          journal="$smoke_root/journal.sqlite3"
          "$wheel_cli" --journal "$journal" --json recommend \
            --task-kind deep_work --energy medium --available-minutes 60 \
            --decision-id 018f4f69-e7a2-7f84-8c2d-9f531c4e9101 \
            --seed 20260725 > "$smoke_root/recommend.json" \
            2> "$smoke_root/recommend.stderr"
          "$wheel_cli" --journal "$journal" --json review \
            018f4f69-e7a2-7f84-8c2d-9f531c4e9101 \
            --fit just_right --completed > "$smoke_root/review.json" \
            2> "$smoke_root/review.stderr"
          "$wheel_cli" --journal "$journal" --json verify \
            > "$smoke_root/verify.json" 2> "$smoke_root/verify.stderr"
          test ! -s "$smoke_root/recommend.stderr"
          test ! -s "$smoke_root/review.stderr"
          test ! -s "$smoke_root/verify.stderr"
          test "$(stat -c '%a' "$smoke_root")" = "700"
          test "$(stat -c '%a' "$journal")" = "600"
          cd "$smoke_root"
          SMOKE_ROOT="$smoke_root" "$wheel_python" -I - <<'PY'
          import json
          import os
          import gworker
          from importlib.metadata import version
          from pathlib import Path

          root = Path(os.environ["SMOKE_ROOT"])
          raw = {
              name: (root / f"{name}.json").read_text("utf-8")
              for name in ("recommend", "review", "verify")
          }
          assert all(str(root) not in content for content in raw.values())
          documents = {name: json.loads(content) for name, content in raw.items()}
          assert gworker.__all__
          assert version("gworker-focus") == "0.1.0"
          assert {
              document["schema_version"] for document in documents.values()
          } == {
              "gworker-cli-recommendation-v1",
              "gworker-cli-review-v1",
              "gworker-cli-verification-v1",
          }
          assert all(
              document["journal_path_disclosed"] is False
              for document in documents.values()
          )
          assert documents["verify"]["policy_decision_count"] == 1
          assert documents["verify"]["policy_review_count"] == 1
          assert documents["verify"]["policy_history_edge_count"] == 0
          assert documents["verify"]["sqlite_check"] == "ok"
          PY

      - name: Prove package checks preserved the checkout
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload verified distributions and report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-distributions-python-3.12
          path: |
            build/dist-primary/*
            build/distribution-verification.json
          if-no-files-found: error
          retention-days: 14
